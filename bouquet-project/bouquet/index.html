<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create Your Bouquet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:ital,opsz,wght@1,9..144,600&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head><body>
<header><h1>Create Your Bouquet</h1><p>Pilih bunga, atur sesukamu, lalu serahkan buketnya.</p></header>
<main class="app">
<section class="left">
<div id="wrap"><div id="sc"></div></div>
<div class="tools" id="tools">
<button data-a="rl" aria-label="Putar kiri">↺</button><button data-a="rr" aria-label="Putar kanan">↻</button>
<button data-a="sm" aria-label="Kecilkan">−</button><button data-a="bg" aria-label="Besarkan">+</button>
<button data-a="fl">Balik</button><button data-a="fr">Ke depan</button><button data-a="del">Hapus</button></div>
<p class="hint">Ketuk bunga untuk memilih, seret untuk memindah.</p>
</section>
<aside class="panel">
<div class="order" id="order"></div>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="grid" id="grid"></div>
<div id="msg" hidden><label for="mt" class="hint">Tulis pesan di kartu</label><textarea id="mt" rows="2" maxlength="60"></textarea></div>
<div><p class="hint" style="margin:0 0 6px">Pembungkus</p><div class="grid" id="wp" style="grid-template-columns:repeat(4,1fr)"></div></div>
<div class="row" id="tot" style="justify-content:space-between;font-weight:800;color:var(--ink);font-size:16px"></div>
<div class="row"><button id="done" class="primary">Serahkan buket</button><button id="clr">Mulai ulang</button><button id="nord">Pesanan baru</button></div>
</aside></main>
<dialog id="dlg"><div class="stars" id="st"></div><h2 id="rt" style="font:italic 600 24px Fraunces,serif;margin:4px 0;color:var(--leaf)"></h2><p id="rd" class="hint"></p><div id="bill" class="hint" style="text-align:left;margin:6px 0"></div><img id="ri" alt="Buket hasil rangkaianmu"><p class="hint">Tekan lama atau klik kanan gambar untuk menyimpan.</p><button class="primary" id="cl">Lanjut merangkai</button></dialog>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body></html>
